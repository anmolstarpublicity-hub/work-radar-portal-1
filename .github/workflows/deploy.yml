name: Deploy Work Radar to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build
        working-directory: ./client
        run: |
          echo "--- Installing client dependencies ---"
          npm ci
          echo "--- Building client files ---"
          npm run build

      # Step 4: Securely copy ONLY the compiled frontend files directly to target
      - name: Deploy Frontend Files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 90s
          source: "client/dist/*"
          strip_components: 2  # <--- Essential: Copies content of dist, not the folders
          target: "${{ secrets.PROJECT_PATH }}/client/dist"
          rm: true

      # Step 5: Copy Backend Server files safely
      - name: Deploy Backend Files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 90s
          source: "server/*"
          strip_components: 1
          target: "${{ secrets.PROJECT_PATH }}/server"

      # Step 6: SSH Execution & Server Reload
      - name: Install Dependencies and Restart Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 90s
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" 
            
            echo "--- Navigating to backend directory ---"
            cd ${{ secrets.PROJECT_PATH }}/server
            
            echo "--- Installing production dependencies ---"
            npm ci --production
            
            echo "--- Reloading application with PM2 ---"
            pm2 reload work-radar-api || pm2 restart work-radar-api
            
            echo "--- Deployment Complete ---"