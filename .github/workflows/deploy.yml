name: Deploy Work Radar to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build
        working-directory: ./client
        run: |
          echo "--- Installing client dependencies ---"
          npm ci
          echo "--- Building client files ---"
          npm run build

      # Step 4: Securely copy files with Debug & Custom Timeout configurations
      - name: Deploy to Hostinger via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s  # <--- Forced timeout scaling to allow slower handshakes
          source: "client/dist, server"
          target: ${{ secrets.PROJECT_PATH }}
          rm: true

      # Step 5: SSH Commands run execution
      - name: Install Dependencies and Restart Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            echo "--- Navigating to project directory on server ---"
            cd ${{ secrets.PROJECT_PATH }}/server
            
            echo "--- Installing backend dependencies ---"
            npm ci --production
            
            echo "--- Reloading application with PM2 ---"
            pm2 reload work-radar-api || pm2 restart work-radar-api
            
            echo "--- Deployment Complete ---"